<!-- บอกเบราว์เซอร์ว่านี่คือเอกสาร HTML5 -->
<!DOCTYPE html>
<!-- แท็กเปิดของหน้าเว็บ กำหนดภาษาเริ่มต้นเป็นภาษาไทย -->
<html lang="th">
<head>
  <!-- กำหนดชุดตัวอักษรเป็น UTF-8 เพื่อให้แสดงภาษาไทยถูกต้อง -->
  <meta charset="UTF-8" />
  <!-- ตั้งค่าหน้าเว็บให้ responsive ตามขนาดหน้าจออุปกรณ์ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ข้อความที่แสดงบนแท็บเบราว์เซอร์ -->
  <title>ตรวจสอบคำสั่งซื้อ | SNEAK&apos;R</title>
  <!-- เชื่อมไฟล์ CSS เดียวกันกับหน้าแรก เพื่อให้ธีม/สไตล์เหมือนกันทั้งเว็บ -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- แถบเมนูด้านบน เหมือนกับหน้าอื่น ๆ เพื่อให้กดสลับหน้าได้ตลอดเวลา -->
  <header class="navbar">
    <a href="index.html" class="logo">SNEAK<span>&apos;R</span></a>
    <nav>
      <a href="index.html">สินค้า</a>
      <!-- ลิงก์หน้านี้เอง ไม่ต้องใส่ href ไปที่อื่น -->
      <a href="track.html">ตรวจสอบคำสั่งซื้อ</a>
      <a href="cart.html" class="cart-link">
        🛒 ตะกร้า <span class="cart-count" id="cartCount">0</span>
      </a>
    </nav>
  </header>

  <main class="section">
    <h2 class="section-title">ตรวจสอบสถานะคำสั่งซื้อ</h2>
    <p style="color: var(--text-dim); margin-top: -16px; margin-bottom: 28px;">
      กรอกหมายเลขคำสั่งซื้อ (ได้รับหลังสั่งซื้อสำเร็จ) พร้อมเบอร์โทรที่ใช้ตอนสั่งซื้อ เพื่อดูสถานะล่าสุด
    </p>

    <!-- ฟอร์มค้นหาคำสั่งซื้อ เมื่อกด submit จะถูก JavaScript ดักไว้ (preventDefault) แล้วยิงไปที่ API แทนการรีโหลดหน้า -->
    <form id="trackForm" style="max-width: 420px;">
      <div class="field">
        <label for="trackOrderId">หมายเลขคำสั่งซื้อ</label>
        <input type="text" id="trackOrderId" placeholder="เช่น omsxxxxxxxx" required />
      </div>
      <div class="field">
        <label for="trackPhone">เบอร์โทรที่ใช้ตอนสั่งซื้อ</label>
        <input type="tel" id="trackPhone" required />
      </div>
      <button type="submit" class="btn btn-block">ตรวจสอบสถานะ</button>
    </form>

    <!-- ผลลัพธ์การค้นหาจะถูกวาดลงในนี้โดย track.js เริ่มต้นซ่อนไว้ก่อน -->
    <div id="trackResult" style="display:none; margin-top: 32px; max-width: 560px;"></div>
  </main>

  <footer>© 2026 SNEAK&apos;R Shop. All rights reserved.</footer>

  <!-- กล่องข้อความแจ้งเตือนเล็ก ๆ (toast) เช่นตอนค้นหาไม่พบ -->
  <div class="toast" id="toast"></div>

  <!-- โหลด common.js ก่อน เพื่อให้มีฟังก์ชันกลาง (API_BASE, formatPrice, showToast) ให้ track.js เรียกใช้ได้ -->
  <script src="js/common.js"></script>
  <!-- โหลด track.js ซึ่งควบคุมการทำงานหลักของหน้านี้ -->
  <script src="js/track.js"></script>
</body>
</html>
